[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-advisory"
version = "0.1.0"
description = "AI + Energy + Commodities investment research system (multi-agent, paper-trading only)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "requests>=2.31",
  "openpyxl>=3.1",
  "anthropic>=2.0",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.40"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
qa = "qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
